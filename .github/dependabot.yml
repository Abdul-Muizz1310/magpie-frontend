version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # `next build` resolves typescript/lib/typescript.js; TypeScript 7 (the Go
      # rewrite) ships no such file, so the bump fails the build as "you do not
      # have the required package(s) installed" (PR #13). test/toolchain.test.ts
      # holds the same line.
      - dependency-name: "typescript"
        versions: [">=7"]
    # react and react-dom are both pinned to one exact version and must be
    # raised together. Ungrouped, dependabot opens a PR per package and lifts
    # only one, and react-dom reaches into react internals that are guaranteed
    # to match only within an exact version — so the skew breaks every component
    # suite without naming the cause. Exact names, not prefixes, so "react"
    # cannot sweep in react-is.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
